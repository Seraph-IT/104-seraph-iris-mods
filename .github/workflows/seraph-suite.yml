---
# SPDX-License-Identifier: LicenseRef-Seraph-Internal-1.0
# Duenner Aufrufer der Seraph-Suite. Verteilt mit scripts/suite_verteilen.py zusammen mit der Hub-Kopie
# seraph-suite-hub.yml im selben Verzeichnis. Von Hand nur `typ` und die optionalen Befehle aendern;
# scripts/suite_drift.py prueft den Rest.
#
# Ablage: .github/workflows/, solange das Repo keine .gitea/workflows hat (Gitea liest nur das erste vorhandene
# Verzeichnis, .gitea vor .github). Das Verteil-Skript waehlt das Verzeichnis und setzt den Pfad in `uses`.
#
# GitHub Actions ist org-weit aus; der Waechter auf server_url verhindert trotzdem jeden Lauf auf github.com.
name: seraph-suite

# Ausloeser (Hermes 25.11.2026): pull_request, push auf den Standardbranch (main, in 301 master), Zeitplan und
# Hand. Kein push auf andere Branches mehr, sonst lief die Suite je Branch-Push und noch einmal fuer den PR.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "53 1 * * 0"   # Slot aus 106 ci-templates/nachtlauf.yml
  workflow_dispatch:

# PRs: ein neuerer Push bricht den aelteren Lauf ab. Auf dem Standardbranch traegt die Gruppe die SHA, dort wird nie
# abgebrochen.
concurrency:
  # Gefaltet (>-), damit keine Zeile ueber 120 Zeichen hat (ansible-lint in 002, 26.11.2026).
  group: >-
    ${{ github.workflow }}-${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch || 'main')
    && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    if: github.server_url != 'https://github.com'
    # Ohne runs-on nimmt jeder Runner den Job, auch der molecule-Runner (Lauf 18232 in 106).
    runs-on: [self-hosted, gitea-runner]
    uses: ./.github/workflows/seraph-suite-hub.yml
    with:
      typ: python            # python | ansible | frappe | web | terraform | powershell | generisch
      # lint_befehl: "ruff check ."
      # Bis 27.11.2026 ohne test_befehl: die 29 Tests der beiden Enforcer liefen in keiner CI (Hermes, Liste in
      # devops .scratch/106-e2e-errors/hub-test-befehl-liste.md). Jedes Paket hat eigene pytest-Wurzel (pyproject).
      test_befehl: >-
        cd iris/IrisCustomerTagEnforcer && python -m pytest -q -p no:cacheprovider
        && cd ../../misp/MispCustomerTagEnforcer && python -m pytest -q -p no:cacheprovider
      vorbereitung: "pip install pytest==9.2.0"
      # Ohne test_befehl sucht der Hub einen eigenen Workflow mit Testaufruf auf push und pull_request, sonst rot.
      # tests_begruendung: "Repo hat nichts, was ein Test pruefen kann, weil ..."
      # tests_in: "ci.yml"
    secrets: inherit
